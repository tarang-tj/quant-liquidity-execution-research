name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install research and live-bridge dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy websockets
      - name: Run unit and invariant tests
        run: python -m unittest discover -s tests -v
      - name: Compile runtime modules
        run: python -m compileall -q live tests/test_live.py
      - name: Verify offline predictor path
        run: python live/train_predictor.py --symbol SPY --input tests/fixtures/spy_bars.csv --output /tmp/spy_model.json
      - name: Check scoped formatting and whitespace
        run: git diff --check -- README.md live tests .github
